name: Refresh public repositories

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Fetch public repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-repos.mjs

      - name: Commit refreshed data if changed
        id: changes
        run: |
          if git diff --quiet -- data/repos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repos.json
          git commit -m "Refresh public repository data"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN pushes do not trigger the push workflow, so deploy here too.
      - name: Configure Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload refreshed site
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy refreshed site
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
